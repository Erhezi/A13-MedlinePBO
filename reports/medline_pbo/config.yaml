# ──────────────────────────────────────────────
# Medline PBO Pipeline — Configuration
# ──────────────────────────────────────────────

email:
  aad_endpoint: "https://login.microsoftonline.com"
  graph_endpoint: "https://graph.microsoft.com"
  from_email: "procurementdatateam@montefiore.org"
  folder_name: "Monte PBO"
  keyword: "Proactive BackOrder Report"
  destination_path: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\Monte PBO\Raw'
  max_messages: 100
  # Attachment matching (consumed by src/msgraph.py)
  attachment_prefix: "Proactive"
  attachment_extensions: [".xlsx"]
  inbox_lookback_days: 6

database:
  driver: "{ODBC Driver 17 for SQL Server}"
  server: "MISCPrdAdhocDB"
  database: "PRIME"
  trusted_connection: "yes"
  locations:
    - "IMDCSTRM"
    - "IPYCSTRM"

report:
  version: "1.6"
  # --------------------  new in v1.4 - 2026-03-18 --------------------
  # - Multi-location aggregation: IMDCSTRM + IPYCSTRM combined for inventory
  #   and usage so metrics reflect both sites.
  # - UOM integrity check: detect (VendorItem, Item) UOM mismatches; save those
  #   rows to an optional `UOM inconsistency` sheet and exclude IPYCSTRM rows
  #   for inconsistent items from aggregation.
  # - Reporting: adds a hidden `In IPYCSTRM` flag per Item; writes the
  #   `UOM inconsistency` worksheet only when inconsistencies exist.
  # ---------------------------------------------------------------------
  # --------------------  new in v1.5 - 2026-06-17 --------------------
  # - added new columns: "Manufacturer", "SUOM", "IB Code", "IB Note", 
  #   "Customer Prefered Sub", "Substitute Material Number"
  # - data source change: Medline is providing direct system automated export
  #   instead of rep sending manual files (the file header has a timestamp row, 
  #   so we need to get rid of row 1 when reading the file into dataframe)
  # - Reporting: column added and shown as base columns
  # ---------------------------------------------------------------------
  # --------------------  new in v1.6 - 2026-07-01 --------------------
  # - move 'Medline Item', 'MIOH' to the top of the base report columns
  # - freeze pane (top row) and column A, B (on the left side) in the final Excel
  #   output, same as freeze pane at C2 (report.freeze_panes)
  # - add a desired-DIOH order block (yellow header, report.yellow_header_cols),
  #   populated only for rows flagged 'Review':
  #   "Desired DIOH" (default to report.desired_dioh_default = 30),
  #   "Qty to order for Desired DIOH" — a live Excel formula (report.formula_cols):
  #     ((Desired DIOH - DIOH) * AverageDailyIssueOut - OnOrderQty) / BuyUOMMultiplier
  #   "UOM" (takes the value from "DefaultBuyUOM"),
  #   "YYYY-MM-DD Notes" (header's YYYY-MM-DD stamped with the run date)
  # - Reporting: columns added under the yellow desired-DIOH header, additional 
  #   styling for MIOH added (light-green cell background where MIOH > 0)
  # ---------------------------------------------------------------------
  
  review_threshold: -10 # in days
  # basically this means we need to have at least 10 days of coverage by the estimated available date. 
  # it is measured as Days Get Well - DIOH
  # Days Get Well = Est Available Date - Today
  # DIOH = On Hand / Average Daily Issue Out
  output_dir: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\Monte PBO'
  file_name_split_token: "Levels"
  output_basename: "Processed_Monte_PBO"

  # ── styler (consumed by src/excel.py) ──
  font: { name: "Calibri", size: 10 }
  header_row_height: 85
  default_col_width: 8.43
  freeze_panes: [1, 2]   # freeze top row + columns A, B (== freeze pane at C2)
  column_order: ["base_report", "item", "item_group", "rmd", "rmd_debug", "stamp"]
  hide_groups: ["rmd_debug", "stamp"]
  header_colors:
    base_report: { bg: "#94c5e3" }
    item: { bg: "#003769", font: "white" }
    item_group: { bg: "#112b47", font: "white" }
    rmd: { bg: "#ca006c", font: "white" }
  sort_by: ["Matched IMDC + IPYC", "Get Well - DIOH", "Get Well - DIOH_ig"]
  sort_ascending: [true, false, false]
  row_filter: { column: "Matched IMDC + IPYC", value: "Matched" }
  conditional_color:
    columns: ["Get Well - DIOH", "Get Well - DIOH_ig"]
    threshold_key: "review_threshold"
  # Light-green cell background where the column's own value meets the comparison.
  value_fills:
    - column: "MIOH"
      criteria: ">"
      value: 0
      bg: "#C6EFCE"   # light green

  # Jesse selection criteria
  risk_levels: ["High", "Severe"]
  duration_threshold: 3

  # Default target DIOH for the v1.6 "Qty to order for Desired DIOH" columns.
  desired_dioh_default: 30

  required_columns: # for the input file
    - "Risk Level"
    - "Customer Material Number"
    - "Medline Item"
    - "Manufacturer Item"
    - "Material Description"
    - "On Allocation?"
    - "Packaging String"
    - "Est Available Date"
    - "Parent Item"
    - "Duration"
    - "Forecast Qty"
    - "Manufacturer" #added in v1.5
    - "SUOM" #added in v1.5
    - "IB Code" #added in v1.5
    - "IB Note" #added in v1.5
    - "Customer Prefered Sub" #added in v1.5
    - "Substitute Material Number" #added in v1.5
    # - "SoldTo"
    # - "SoldToName"
    # - "Branch"

  # ── Column groups (control report layout) ──
  columns:
    base_report:
      - "Medline Item"
      - "MIOH"
      - "Risk Level"
      - "Customer Material Number"
      - "Manufacturer"
      - "Manufacturer Item"
      - "Material Description"
      - "Forecast Qty"
      - "On Allocation?"
      - "Packaging String"
      - "SUOM"
      - "Est Depletion Date"
      - "Est Available Date"
      - "Duration"
      - "Est Delivery Date"
      - "Doc Appointment Date"
      - "Parent Item"
      - "Jesse Selection"
      - "IB Code"
      - "IB Note"
      - "Customer Prefered Sub"
      - "Substitute Material Number"
      - "Dummy ID"

    item:
      - "Matched IMDC + IPYC"
      - "In IPYCSTRM"
      - "No Issue Out (Last 365 Days)"
      - "report stamp"
      - "Item"
      - "VendorItem"
      - "AvailableQty"
      - "OnOrderQty" 
      - "DefaultBuyUOM"
      - "BuyUOMMultiplier"
      - "StockUOM"
      - "AverageDailyIssueOut"
      - "DIOH"
      - "Days to Get Well"
      - "Get Well - DIOH"
      - "Flag"
      - "Desired DIOH"                  # NEW ON v1.6
      - "Qty to order for Desired DIOH" # NEW ON v1.6
      - "UOM"                           # NEW ON v1.6
      - "YYYY-MM-DD Notes"              # NEW ON v1.6
      - "Description3"

    item_group:
      - "With Sub"
      - "Item Group"
      - "Replace Item"
      - "VendorItem_Repl."
      - "AvailableQty_Repl."
      - "OnOrderQty_Repl."
      - "DefaultBuyUOM_Repl."
      - "BuyUOMMultiplier_Repl."
      - "StockUOM_Repl."
      - "Description3_Repl."
      - "AvailableQty_ig"
      - "AverageDailyIssueOut_ig"
      - "DIOH_ig"
      - "Get Well - DIOH_ig"
      - "Flag_ig"

    rmd:
      - "Recommended Order Qty (EA)"
      - "Recomended Order Qty (in BuyUOM)"
      - "Recomended Order Qty (in BuyUOM)_Repl."
      - "Alternative UOM Group"
      - "from UOM"
      - "to UOM"
      - "Conversion Factor"
      - "Recomnded Order Qty (In Alternative from UOM)"

    rmd_debug:
      - "Target Item Qty (EA)"
      - "Target Item Qty (EA)_ig"
      - "Target Coverage"
      - "Target Coverage_ig"

    stamp:
      - "Inventory Data As Of"

  # ── Columns to hide in the final Excel ──
  col_to_hide:
    - "Doc Appointment Date"
    - "Parent Item"
    - "Dummy ID"
    - "No Issue Out (Last 365 Days)"
    - "report stamp"
    - "VendorItem"
    - "VendorItem_Repl."
    - "Flag_ig"
    # rmd_debug + stamp are appended programmatically
  
  # ── Formatting groups ──
  date_cols:
    - "Est Depletion Date"
    - "Est Available Date"
    - "Est Delivery Date"

  two_decimal_cols:
    - "AverageDailyIssueOut"
    - "AverageDailyIssueOut_ig"

  thousands_sep_cols:
    - "AvailableQty"
    - "OnOrderQty"
    - "BuyUOMMultiplier"
    - "Qty to order for Desired DIOH"  # NEW ON v1.6 (embedded formula result)
    - "AvailableQty_Repl."
    - "AvailableQty_ig"
    - "OnOrderQty_Repl."
    - "BuyUOMMultiplier_Repl."
    - "Recommended Order Qty (EA)"
    - "Recomended Order Qty (in BuyUOM)"
    - "Recomended Order Qty (in BuyUOM)_Repl."
    - "Conversion Factor"
    - "Recomnded Order Qty (In Alternative from UOM)"
    - "DIOH"
    - "DIOH_ig"
    - "Get Well - DIOH"
    - "Get Well - DIOH_ig"

  fill_cols:
    - "Material Description"
    - "Description3"
    - "Description3_Repl."
    - "IB Code"
    - "IB Note"
    - "YYYY-MM-DD Notes"

  yellow_header_cols:
    - "Desired DIOH"
    - "Qty to order for Desired DIOH"
    - "UOM"
    - "YYYY-MM-DD Notes"

  # ── Live Excel formulas (consumed by src/excel.py) ──
  # Each {Column Name} token is replaced with that column's live cell reference
  # for the current row, e.g. the template below renders as =((AN8-AJ8)*AI8-AE8)/AG8.
  # only_when limits the formula to rows whose gate column equals the value.
  formula_cols:
    "Qty to order for Desired DIOH":
      template: "=(({Desired DIOH}-{DIOH})*{AverageDailyIssueOut}-{OnOrderQty})/{BuyUOMMultiplier}"
      only_when: { column: "Flag", value: "Review" }

